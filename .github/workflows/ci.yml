name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches what a YAML parser cannot: contexts used where they are unavailable (putting
      # `secrets` in a step's `if:` invalidates the entire file, and GitHub then simply refuses to
      # run it — there is no failing job to notice), unknown keys, and shell mistakes inside `run:`.
      # Pinned rather than `latest` so a new actionlint release cannot change the verdict on its own.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  code-quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ktlint for formatting, detekt for code smells. Both see handwritten sources only — generated
      # code is excluded in the root build file. detekt's per-module baselines record the findings
      # that existed when it was introduced, so this gates new code without demanding a cleanup
      # first; the baselines are meant to shrink.
      - name: Lint and analyse
        run: ./gradlew ktlintCheck detekt --console=plain

  shared-tests:
    name: Shared tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No credentials are needed: local.properties is git-ignored, and the build tolerates it
      # being absent. That is worth having CI prove on every push.
      - name: Test and compile
        run: ./gradlew :shared:jvmTest :desktopApp:compileKotlin --console=plain

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Android SDK ships with the runner, but the platform has to be fetched. Since API 36,
      # platform package names carry a minor version: the installable name is
      # `platforms;android-37.0`, and plain `android-37` is not found.
      #
      # This step is an optimisation, not a gate. AGP downloads a missing platform by itself (that
      # is how it works locally), so a failure here is tolerated and the build below decides.
      - name: Pre-fetch Android SDK Platform 37
        shell: bash
        run: |
          # A glob rather than `ls` or `find`: nothing to break under `pipefail`, and it copes with
          # the runner image moving cmdline-tools around.
          sdkmanager=""
          for candidate in "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              sdkmanager="$candidate"
              break
            fi
          done

          if [ -z "$sdkmanager" ]; then
            echo "::warning::No sdkmanager found; leaving the download to Gradle."
            exit 0
          fi

          # `yes` dies with SIGPIPE once sdkmanager stops reading, and `pipefail` would turn that
          # into a spurious failure of this step — hence discarding its stderr and ignoring the
          # result. Licences are what matter, and they are usually already accepted on the runner.
          yes 2>/dev/null | "$sdkmanager" --licenses > /dev/null 2>&1 || true

          "$sdkmanager" "platforms;android-37.0" \
            || echo "::warning::Could not pre-fetch it; letting Gradle try."

      - name: Assemble the debug APK
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: notesAI-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
