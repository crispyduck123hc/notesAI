name: Release desktop installers

# Native distributions cannot be cross-compiled: each package format has to be built on its
# own operating system, which is the whole reason this is a matrix rather than one job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # local.properties is git-ignored; the build compiles these into LocalSecrets. Empty
      # values still build, but a release should carry the real client ids.
      - name: Provide OAuth client ids
        shell: bash
        run: |
          {
            echo "google.desktop.clientId=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}"
            echo "google.desktop.clientSecret=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}"
          } >> local.properties

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && secrets.MACOS_CERT_P12 != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm cert.p12

      # `packageDistributionForCurrentOS` rather than the ProGuard (`Release`) variant: R8/ProGuard
      # needs keep rules for kotlinx.serialization, Ktor and SQLDelight before it is safe to ship.
      - name: Build the installer
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      # Notarization is a separate step, and macOS-only.
      - name: Notarize the macOS build
        if: runner.os == 'macOS' && secrets.NOTARIZATION_APPLE_ID != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: ./gradlew :desktopApp:notarizeDmg

      - uses: actions/upload-artifact@v4
        with:
          name: notesAI-${{ matrix.os }}
          # Installers only. The whole `compose/binaries/` tree also holds the app image and its
          # bundled runtime — hundreds of megabytes that would clutter the release page.
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/pkg/*.pkg
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  # Collects the three platforms' installers onto one release page, so the download a visitor
  # sees matches their operating system.
  release:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist

          # Each platform only produces its own format, so most of these patterns match
          # nothing — nullglob keeps the missing ones out of the file list.
          shopt -s nullglob
          files=(dist/*.dmg dist/*.pkg dist/*.msi dist/*.exe dist/*.deb dist/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced; refusing to publish an empty release."
            exit 1
          fi

          # A hyphen in the tag means a pre-release by convention (v1.0.0-beta.1), and that is the
          # only way to say it: jpackage rejects a 0.x version, so the number itself cannot carry
          # "this is early". GitHub then keeps it out of /releases/latest and labels it on the page.
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease+=(--prerelease) ;;
          esac

          # Checksums, so someone can confirm the file they received is the one that was built.
          # Worth more than usual here because the macOS build is unsigned. Bare filenames, so
          # `shasum -a 256 -c SHA256SUMS.txt` works in whatever folder they downloaded into.
          (cd dist && sha256sum $(basename -a "${files[@]}") > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

          # Refuse to publish an empty release, and note that `--generate-notes` needs the tag.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "notesAI $GITHUB_REF_NAME" \
            --generate-notes \
            ${prerelease[@]+"${prerelease[@]}"} \
            "${files[@]}" \
            dist/SHA256SUMS.txt

          # Put the install instructions above the generated changelog. For an unsigned macOS
          # build "why won't it open?" is the first question every downloader has, and a release
          # page is where they will look. Cosmetic, so a failure here warns rather than failing an
          # otherwise-good release.
          notes=$(mktemp)
          if [ -f .github/RELEASE_NOTES.md ]; then
            cat .github/RELEASE_NOTES.md > "$notes"
            printf '\n---\n\n' >> "$notes"
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body \
            | jq -r .body >> "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" \
            || echo "::warning::Could not prepend the install instructions; edit the release by hand."
