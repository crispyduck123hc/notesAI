#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Application version, in one place. The desktop installer name, the Android version name, and the
# version the app displays all read this, so they cannot drift apart — a tag that disagrees with
# the artifacts it points at is a genuinely confusing release.
#
# It must also satisfy jpackage, which names the installers: MAJOR.MINOR[.BUILD] with MAJOR >= 1.
# A 0.x version is rejected outright, so "pre-release" has to be expressed in the tag
# (v1.0.0-beta.1) rather than in the number.
notesai.version=1.0.0